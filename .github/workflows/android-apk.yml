name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-app
      - feature/android-care-ui-cleanup
      - feature/android-pet-name-manual-energy
    paths:
      - "android/**"
      - "pet.cpp"
      - "pet.h"
      - "dex.h"
      - "i18n.cpp"
      - "i18n.h"
      - "test/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as public GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: TamaPoke Android Debug #${{ github.run_number }}
          body: |
            Automatically generated installable Android debug APK.
            Commit: ${{ github.sha }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
