name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Fijado a la version del core verificada para compilar este sketch. Subirla
      # a mano y a proposito: alguna version nueva del core ha roto librerias de
      # terceros antes.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib U8g2

      - name: Prepare Arduino sketch directory
        run: |
          mkdir -p "$RUNNER_TEMP/TamaPoke"
          cp -a *.ino *.h *.hpp *.cpp boards "$RUNNER_TEMP/TamaPoke/"

      - name: Compile
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          "$RUNNER_TEMP/TamaPoke"

      # Guition/Sunton 4848S040 (ST7701S RGB 480x480 + GT911): mismo codigo,
      # la capa board.h elige placa con un flag de compilacion. Se compila aqui
      # para que la compatibilidad no se oxide.
      - name: Compile (Guition 4848S040)
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          --build-property "compiler.cpp.extra_flags=-DBOARD_GUITION_4848S040"
          "$RUNNER_TEMP/TamaPoke"

      # SpotPear 1.28" AI Ball (GC9A01 240x240 + CST816, experimental): same
      # code and FQBN, the UI is drawn at 480 and shrunk 2:1 on flush.
      - name: Compile (SpotPear 1.28 AI Ball)
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          --build-property "compiler.cpp.extra_flags=-DBOARD_SPOTPEAR_BALL128"
          "$RUNNER_TEMP/TamaPoke"

      # Waveshare AMOLED 1.75C (experimental): mismo codigo con
      # -DBOARD_AMOLED_175C=1 y su tabla de particiones (boards/175c/). Se
      # compila con el mismo script que se usa en casa para que no se oxide.
      - name: Compile (Waveshare AMOLED 1.75C)
        run: tools/build_175c.sh --out "$RUNNER_TEMP/out-175c"

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h y species.h llevan "GENERADO - no editar" en su cabecera; esto pilla
      # a quien edite la salida en vez del generador, o se olvide de regenerar
      # tras tocar los datos de origen.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compilan y corren en el PC contra unos shims
      # de Arduino, con millis() y random() falsos y una NVS en memoria. Aqui es
      # donde se han roto las cosas: los tres bugs de la v1.3, v1.4 y v1.8 eran
      # logica pura y estos tests los pillan sin tocar la placa.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py

  windows-desktop:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S windows -B build/windows -A x64
      - name: Build
        run: cmake --build build/windows --config Release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-Windows-x64
          path: build/windows/Release/*
          if-no-files-found: error

  android-compile:
    name: Android compile and lint (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Compile Kotlin and native C++ plus run lint/unit-test tasks.
      # Deliberately do not run assembleDebug/assembleRelease: no APK is produced in CI.
      - name: Compile Android Kotlin and native code
        working-directory: android
        run: gradle --no-daemon :app:compileDebugKotlin :app:externalNativeBuildDebug :app:lintDebug :app:testDebugUnitTest
